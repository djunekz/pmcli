[package]
name = "pmcli"
version = "0.1.0"
edition = "2021"
description = "Project and task manager CLI for Termux and Linux with a terminal UI and Git sync"
license = "MIT"
repository = "https://github.com/djunekz/pmcli"
homepage = "https://github.com/djunekz/pmcli"
documentation = "https://github.com/djunekz/pmcli#readme"
readme = "README.md"
keywords = ["cli", "tasks", "project-management", "tui", "termux"]
categories = ["command-line-utilities"]
rust-version = "1.75"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
openssl = { version = "0.10", features = ["vendored"] }
serde_json = "1.0"
ratatui = "0.26"
crossterm = "0.29"
git2 = "0.18"
aes-gcm = "0.11"
rand = "0.10"
base64 = "0.23"
toml = "0.8"
sha2 = "0.10"
colored = "3.1"
whoami = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[dev-dependencies]
serde_json = "1.0"
